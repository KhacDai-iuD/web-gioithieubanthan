<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu bản thân - Đinh Khắc Đại</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }
        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .student-id {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .info-section {
            text-align: left;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #e9ecef;
        }
        .info-section h3 {
            color: #007bff;
            margin-bottom: 12px;
            font-size: 18px;
        }
        .hobbies-list {
            list-style: none;
        }
        .hobbies-list li {
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
            color: #444;
            display: flex;
            align-items: center;
            font-size: 15px;
        }
        .hobbies-list li:last-child {
            border-bottom: none;
        }
        .hobbies-list li span {
            margin-right: 12px;
            font-size: 20px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #007bff;
            font-weight: 600;
            font-size: 14px;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="images.jpg" alt="Ảnh đại diện Đinh Khắc Đại" class="avatar">

        <h1>Đinh Khắc Đại</h1>
        <p class="student-id">Mã sinh viên: 24100340</p>

        <div class="info-section">
            <h3>🎯 Sở thích cá nhân</h3>
            <ul class="hobbies-list">
                <li><span>🏸</span> Đánh cầu lông</li>
                <li><span>🍳</span> Nấu ăn</li>
                <li><span>🎧</span> Nghe nhạc</li>
            </ul>
        </div>

        <a href="../../index.html" class="back-btn">← Quay lại trang chủ</a>
    </div>

</body>
</html>
